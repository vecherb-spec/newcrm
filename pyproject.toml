[project]
name = "led-ops"
version = "0.1.0"
description = "Self-hosted ERP/CRM for LED screen engineering and production"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13",
  "arq>=0.26",
  "asyncpg>=0.29",
  "fastapi>=0.115",
  "greenlet>=3.1",
  "httpx>=0.27",
  "jinja2>=3.1",
  "openai>=1.52",
  "pwdlib[argon2]>=0.3.1",
  "PyJWT>=2.14.0",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.12",
  "redis>=5.2",
  "sqlalchemy[asyncio]>=2.0",
  "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
namespaces = true

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"] # FastAPI dependency injection intentionally uses callable defaults.
