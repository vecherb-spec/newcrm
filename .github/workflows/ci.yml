name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ledops_test
          POSTGRES_USER: ledops
          POSTGRES_PASSWORD: ledops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledops -d ledops_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://ledops:ledops@127.0.0.1:5432/ledops_test
      SECRET_KEY: ci-secret-key-change-me

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libharfbuzz-subset0 libpango-1.0-0 libpangoft2-1.0-0

      - name: Install Python dependencies
        run: python -m pip install -e '.[dev]'

      - name: Lint
        run: ruff check .

      - name: Run migrations on PostgreSQL
        run: alembic upgrade head

      - name: Test
        run: pytest -q
