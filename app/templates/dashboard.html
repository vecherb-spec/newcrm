<!doctype html>
<html lang="ru" class="h-full bg-slate-950">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LED Ops</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="h-full text-slate-100" x-data="{ section: 'pipeline' }"
      @keydown.window.meta.k.prevent="$refs.search.focus()">
  <div class="flex min-h-full">
    <aside class="w-64 border-r border-slate-800 bg-slate-900 p-5">
      <div class="mb-8 text-xl font-bold text-cyan-400">LED OPS</div>
      <nav class="space-y-1 text-sm">
        <template x-for="item in ['pipeline','engineering','projects','warehouse','finance']">
          <button @click="section=item"
                  :class="section===item ? 'bg-cyan-500/15 text-cyan-300' : 'text-slate-400'"
                  class="block w-full rounded px-3 py-2 text-left capitalize" x-text="item"></button>
        </template>
      </nav>
      <a class="absolute bottom-5 text-xs text-slate-500" href="/docs">API / OpenAPI</a>
    </aside>
    <main class="flex-1 p-7">
      <header class="mb-7 flex items-center justify-between">
        <div>
          <p class="text-xs uppercase tracking-widest text-cyan-500">Операционный центр</p>
          <h1 class="text-2xl font-semibold" x-text="section"></h1>
        </div>
        <input x-ref="search" placeholder="Поиск ⌘K"
               class="w-72 rounded-lg border border-slate-700 bg-slate-900 px-4 py-2 text-sm outline-none focus:border-cyan-500">
      </header>
      <section class="grid grid-cols-4 gap-4">
        <template x-for="[label,value] in [['Новые лиды','—'],['В работе','—'],['Монтажи','—'],['Маржа','—']]">
          <article class="rounded-xl border border-slate-800 bg-slate-900 p-5">
            <p class="text-xs text-slate-500" x-text="label"></p>
            <p class="mt-2 text-2xl font-semibold" x-text="value"></p>
          </article>
        </template>
      </section>
      <section class="mt-5 rounded-xl border border-slate-800 bg-slate-900">
        <div class="border-b border-slate-800 px-5 py-4 text-sm font-medium">Рабочая область</div>
        <div class="p-12 text-center text-sm text-slate-500">
          Используйте API для наполнения данных. Интерактивные экраны подключаются к модульным endpoints.
        </div>
      </section>
    </main>
  </div>
</body>
</html>
