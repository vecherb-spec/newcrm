<!doctype html>
<html lang="ru" class="h-full bg-slate-950">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LED Ops</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>[x-cloak]{display:none!important}</style>
</head>
<body class="h-full text-slate-100" x-data="dashboard()" x-init="init()"
      @keydown.window.meta.k.prevent="$refs.search?.focus()">
  <div x-show="!token" class="grid min-h-full place-items-center bg-slate-950 p-6">
    <form @submit.prevent="authenticate" class="w-full max-w-md rounded-2xl border border-slate-800 bg-slate-900 p-8 shadow-2xl">
      <p class="text-xs font-bold tracking-[.3em] text-cyan-400">LED OPS</p>
      <h1 class="mt-4 text-2xl font-semibold" x-text="bootstrap ? 'Первый запуск' : 'Вход'"></h1>
      <p class="mt-2 text-sm text-slate-500" x-text="bootstrap ? 'Создайте первого администратора' : 'Введите данные сотрудника'"></p>
      <input x-show="bootstrap" x-model="credentials.full_name" placeholder="Имя и фамилия"
             class="mt-6 w-full rounded-lg border border-slate-700 bg-slate-950 px-4 py-3 outline-none focus:border-cyan-500">
      <input x-model="credentials.email" type="email" required placeholder="Email"
             class="mt-3 w-full rounded-lg border border-slate-700 bg-slate-950 px-4 py-3 outline-none focus:border-cyan-500">
      <input x-model="credentials.password" type="password" required minlength="12" placeholder="Пароль (от 12 символов)"
             class="mt-3 w-full rounded-lg border border-slate-700 bg-slate-950 px-4 py-3 outline-none focus:border-cyan-500">
      <p x-show="error" x-text="error" class="mt-3 text-sm text-rose-400"></p>
      <button class="mt-5 w-full rounded-lg bg-cyan-500 py-3 font-semibold text-slate-950 hover:bg-cyan-400"
              x-text="bootstrap ? 'Создать администратора' : 'Войти'"></button>
      <button type="button" @click="bootstrap=!bootstrap; error=''"
              class="mt-4 w-full text-xs text-slate-500 hover:text-slate-300"
              x-text="bootstrap ? 'Уже настроено? Войти' : 'Первый запуск'"></button>
    </form>
  </div>

  <div x-cloak x-show="token" class="flex min-h-full">
    <aside class="fixed inset-y-0 w-60 border-r border-slate-800 bg-slate-900 p-5">
      <div class="mb-8 text-xl font-bold text-cyan-400">LED OPS</div>
      <nav class="space-y-1 text-sm">
        <button @click="section='pipeline'"
                :class="section==='pipeline' ? 'bg-cyan-500/15 text-cyan-300' : 'text-slate-400'"
                class="block w-full rounded px-3 py-2 text-left">CRM · Воронка</button>
        <button @click="section='engineering'"
                :class="section==='engineering' ? 'bg-cyan-500/15 text-cyan-300' : 'text-slate-400'"
                class="block w-full rounded px-3 py-2 text-left">Инженерия</button>
        <template x-for="item in ['Проекты','Склад','Финансы']">
          <button disabled class="block w-full rounded px-3 py-2 text-left text-slate-600" x-text="item"></button>
        </template>
      </nav>
      <div class="absolute bottom-5 left-5 right-5">
        <p class="truncate text-xs text-slate-400" x-text="user?.full_name"></p>
        <div class="mt-1 flex justify-between text-xs text-slate-600">
          <span x-text="user?.role"></span>
          <button @click="logout()" class="hover:text-rose-400">Выйти</button>
        </div>
      </div>
    </aside>

    <main class="ml-60 min-w-0 flex-1 p-6">
      <div x-show="section==='pipeline'">
      <header class="mb-6 flex items-center justify-between">
        <div>
          <p class="text-xs uppercase tracking-widest text-cyan-500">Продажи</p>
          <h1 class="text-2xl font-semibold">Воронка сделок</h1>
        </div>
        <div class="flex gap-3">
          <input x-ref="search" x-model="query" placeholder="Поиск ⌘K"
                 class="w-64 rounded-lg border border-slate-700 bg-slate-900 px-4 py-2 text-sm outline-none focus:border-cyan-500">
          <button @click="showLeadForm=true" class="rounded-lg bg-cyan-500 px-4 py-2 text-sm font-semibold text-slate-950">+ Новый лид</button>
        </div>
      </header>

      <section class="mb-5 grid grid-cols-3 gap-4">
        <article class="rounded-xl border border-slate-800 bg-slate-900 p-4">
          <p class="text-xs text-slate-500">Всего лидов</p><p class="mt-1 text-2xl font-semibold" x-text="leads.length"></p>
        </article>
        <article class="rounded-xl border border-slate-800 bg-slate-900 p-4">
          <p class="text-xs text-slate-500">Новые</p><p class="mt-1 text-2xl font-semibold" x-text="byStatus('NEW').length"></p>
        </article>
        <article class="rounded-xl border border-slate-800 bg-slate-900 p-4">
          <p class="text-xs text-slate-500">Успешные</p><p class="mt-1 text-2xl font-semibold text-emerald-400" x-text="byStatus('CLOSED_WON').length"></p>
        </article>
      </section>

      <section class="flex gap-3 overflow-x-auto pb-5">
        <template x-for="status in statuses" :key="status.code">
          <div class="w-64 shrink-0 rounded-xl border border-slate-800 bg-slate-900/60">
            <div class="flex items-center justify-between border-b border-slate-800 px-4 py-3">
              <span class="text-xs font-semibold uppercase" x-text="status.label"></span>
              <span class="rounded-full bg-slate-800 px-2 py-0.5 text-xs" x-text="byStatus(status.code).length"></span>
            </div>
            <div class="min-h-40 space-y-2 p-2">
              <template x-for="lead in byStatus(status.code)" :key="`${lead.id}-${lead.status}`">
                <article class="rounded-lg border border-slate-800 bg-slate-950 p-3">
                  <p class="text-sm font-medium" x-text="lead.title"></p>
                  <p class="mt-2 text-xs text-slate-500" x-text="lead.source"></p>
                  <select x-model="lead.status" @focus="lead._previousStatus=lead.status"
                          @change="$nextTick(() => moveLead(lead))"
                          class="mt-3 w-full rounded border border-slate-800 bg-slate-900 p-1 text-xs text-slate-400">
                    <template x-for="option in statuses"><option :value="option.code" x-text="option.label"></option></template>
                  </select>
                </article>
              </template>
            </div>
          </div>
        </template>
      </section>
      </div>

      <div x-cloak x-show="section==='engineering'">
        <header class="mb-6">
          <p class="text-xs uppercase tracking-widest text-cyan-500">Инженерия</p>
          <h1 class="text-2xl font-semibold">Расчёт LED-экрана</h1>
        </header>
        <div class="grid grid-cols-[380px_minmax(0,1fr)] gap-5">
          <form @submit.prevent="calculateScreen" class="rounded-xl border border-slate-800 bg-slate-900 p-5">
            <h2 class="text-sm font-semibold">Исходные параметры</h2>
            <div class="mt-4 grid grid-cols-2 gap-3">
              <label class="text-xs text-slate-500">Ширина, м
                <input x-model.number="calculationInput.width_m" type="number" step="0.01" min="0.01" required
                       class="mt-1 w-full rounded border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100">
              </label>
              <label class="text-xs text-slate-500">Высота, м
                <input x-model.number="calculationInput.height_m" type="number" step="0.01" min="0.01" required
                       class="mt-1 w-full rounded border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100">
              </label>
              <label class="text-xs text-slate-500">Шаг пикселя, мм
                <input x-model.number="calculationInput.pitch_mm" type="number" step="0.1" min="0.5" required
                       class="mt-1 w-full rounded border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100">
              </label>
              <label class="text-xs text-slate-500">Яркость, нит
                <input x-model.number="calculationInput.brightness_nits" type="number" step="100" min="400" required
                       class="mt-1 w-full rounded border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100">
              </label>
              <label class="text-xs text-slate-500">Кабинет, ширина мм
                <input x-model.number="calculationInput.cabinet_width_mm" type="number" step="1" min="1" required
                       class="mt-1 w-full rounded border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100">
              </label>
              <label class="text-xs text-slate-500">Кабинет, высота мм
                <input x-model.number="calculationInput.cabinet_height_mm" type="number" step="1" min="1" required
                       class="mt-1 w-full rounded border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100">
              </label>
              <label class="text-xs text-slate-500">Резерв БП, %
                <input x-model.number="calculationInput.power_redundancy_percent" type="number" step="1" min="0" max="100"
                       class="mt-1 w-full rounded border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100">
              </label>
              <label class="text-xs text-slate-500">Целевая маржа, %
                <input x-model.number="calculationInput.target_margin_percent" type="number" step="1" min="0" max="99"
                       class="mt-1 w-full rounded border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100">
              </label>
            </div>
            <button class="mt-5 w-full rounded-lg bg-cyan-500 py-2.5 text-sm font-semibold text-slate-950">
              Рассчитать
            </button>
          </form>

          <div class="min-w-0 space-y-5">
            <div x-show="!calculationResult" class="grid min-h-64 place-items-center rounded-xl border border-dashed border-slate-800 text-sm text-slate-600">
              Заполните параметры и выполните расчёт
            </div>
            <template x-if="calculationResult">
              <div class="space-y-5">
                <section class="grid grid-cols-4 gap-3">
                  <template x-for="[label,value] in resultMetrics()" :key="label">
                    <article class="rounded-xl border border-slate-800 bg-slate-900 p-4">
                      <p class="text-xs text-slate-500" x-text="label"></p>
                      <p class="mt-1 text-lg font-semibold" x-text="value"></p>
                    </article>
                  </template>
                </section>
                <section class="overflow-hidden rounded-xl border border-slate-800 bg-slate-900">
                  <table class="w-full text-left text-sm">
                    <thead class="bg-slate-800/60 text-xs text-slate-400">
                      <tr><th class="px-4 py-3">BOM</th><th>Кол-во</th><th>Цена</th><th>Сумма</th></tr>
                    </thead>
                    <tbody>
                      <template x-for="line in calculationResult.bom" :key="line.sku">
                        <tr class="border-t border-slate-800">
                          <td class="px-4 py-3"><span x-text="line.name"></span><span class="ml-2 text-xs text-slate-600" x-text="line.sku"></span></td>
                          <td x-text="`${line.quantity} ${line.unit}`"></td>
                          <td x-text="money(line.unit_cost)"></td>
                          <td class="font-medium" x-text="money(line.total_cost)"></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </section>
                <form @submit.prevent="saveCalculation" class="flex items-end gap-3 rounded-xl border border-slate-800 bg-slate-900 p-4">
                  <label class="flex-1 text-xs text-slate-500">Название версии
                    <input x-model="calculationName" required minlength="2" placeholder="Например: Экран ТЦ — версия 1"
                           class="mt-1 w-full rounded border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100">
                  </label>
                  <label class="w-52 text-xs text-slate-500">Лид
                    <select x-model="calculationLeadId" class="mt-1 w-full rounded border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100">
                      <option value="">Без привязки</option>
                      <template x-for="lead in leads" :key="lead.id"><option :value="lead.id" x-text="lead.title"></option></template>
                    </select>
                  </label>
                  <button class="rounded bg-emerald-500 px-4 py-2 text-sm font-semibold text-slate-950">Сохранить версию</button>
                </form>
              </div>
            </template>
            <section class="rounded-xl border border-slate-800 bg-slate-900">
              <div class="border-b border-slate-800 px-4 py-3 text-sm font-semibold">Последние версии</div>
              <div class="divide-y divide-slate-800">
                <template x-for="item in calculations" :key="item.id">
                  <button @click="loadCalculation(item)" class="flex w-full items-center justify-between px-4 py-3 text-left hover:bg-slate-800/40">
                    <span><span class="block text-sm" x-text="item.name"></span><span class="text-xs text-slate-600" x-text="new Date(item.created_at).toLocaleString('ru-RU')"></span></span>
                    <span class="text-sm font-semibold text-emerald-400" x-text="money(item.suggested_sales_price)"></span>
                  </button>
                </template>
                <p x-show="!calculations.length" class="p-5 text-center text-sm text-slate-600">Сохранённых расчётов пока нет</p>
              </div>
            </section>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div x-cloak x-show="showLeadForm" class="fixed inset-0 grid place-items-center bg-slate-950/80 p-5" @keydown.escape.window="showLeadForm=false">
    <form @submit.prevent="createLead" class="w-full max-w-lg rounded-xl border border-slate-700 bg-slate-900 p-6">
      <h2 class="text-lg font-semibold">Новый лид</h2>
      <input x-model="newLead.title" required minlength="2" placeholder="Название / клиент"
             class="mt-5 w-full rounded border border-slate-700 bg-slate-950 px-4 py-2">
      <textarea x-model="newLead.raw_text" placeholder="Запрос клиента" rows="4"
                class="mt-3 w-full rounded border border-slate-700 bg-slate-950 px-4 py-2"></textarea>
      <div class="mt-5 flex justify-end gap-3">
        <button type="button" @click="showLeadForm=false" class="px-4 py-2 text-sm text-slate-400">Отмена</button>
        <button class="rounded bg-cyan-500 px-4 py-2 text-sm font-semibold text-slate-950">Создать</button>
      </div>
    </form>
  </div>

  <script>
    function dashboard() {
      return {
        token: localStorage.getItem('ledops_token') || '',
        user: null, leads: [], query: '', error: '', bootstrap: false, showLeadForm: false,
        section: 'pipeline', calculations: [], calculationResult: null,
        calculationName: '', calculationLeadId: '',
        calculationInput: {
          width_m: 3, height_m: 2, pitch_mm: 2.5, brightness_nits: 1000,
          cabinet_width_mm: 500, cabinet_height_mm: 500,
          power_redundancy_percent: 15, target_margin_percent: 30
        },
        credentials: {email: '', password: '', full_name: ''},
        newLead: {title: '', raw_text: '', source: 'manual'},
        statuses: [
          ['NEW','Новые'],['QUALIFICATION','Квалификация'],['CALCULATING','Расчёт'],
          ['PROPOSAL_SENT','КП отправлено'],['CONTRACT_SIGNING','Договор'],
          ['IN_PROJECT','В проекте'],['CLOSED_WON','Успех'],['CLOSED_LOST','Отказ']
        ].map(([code,label]) => ({code,label})),
        async api(path, options={}) {
          options.headers = {...(options.headers || {}), Authorization: `Bearer ${this.token}`};
          const response = await fetch(`/api/v1${path}`, options);
          if (response.status === 401) { this.logout(); throw new Error('Требуется вход'); }
          if (!response.ok) {
            const data = await response.json().catch(() => ({}));
            throw new Error(data.detail || 'Ошибка запроса');
          }
          return response.json();
        },
        async init() {
          if (!this.token) return;
          try {
            [this.user, this.leads, this.calculations] = await Promise.all([
              this.api('/auth/me'), this.api('/leads'), this.api('/calculations')
            ]);
          }
          catch (error) { this.error = error.message; }
        },
        async authenticate() {
          this.error = '';
          try {
            if (this.bootstrap) {
              await fetch('/api/v1/auth/bootstrap', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(this.credentials)
              }).then(async r => { if (!r.ok) throw new Error((await r.json()).detail); });
            }
            const body = new URLSearchParams({username: this.credentials.email, password: this.credentials.password});
            const response = await fetch('/api/v1/auth/token', {method: 'POST', body});
            const data = await response.json();
            if (!response.ok) throw new Error(data.detail);
            this.token = data.access_token; localStorage.setItem('ledops_token', this.token);
            await this.init();
          } catch (error) { this.error = error.message; }
        },
        logout() { localStorage.removeItem('ledops_token'); this.token = ''; this.user = null; },
        byStatus(status) {
          const q = this.query.toLocaleLowerCase();
          return this.leads.filter(l => l.status === status && l.title.toLocaleLowerCase().includes(q));
        },
        async createLead() {
          try {
            const lead = await this.api('/leads', {
              method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(this.newLead)
            });
            this.leads.unshift(lead); this.newLead = {title:'',raw_text:'',source:'manual'}; this.showLeadForm=false;
          } catch (error) { this.error = error.message; }
        },
        async moveLead(lead) {
          const previous = lead._previousStatus, status = lead.status;
          try {
            await this.api(`/leads/${lead.id}`, {method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});
            lead._previousStatus = status;
          } catch (error) { lead.status = previous; this.error = error.message; }
        },
        async calculateScreen() {
          try {
            this.calculationResult = await this.api('/calculations/screen', {
              method:'POST', headers:{'Content-Type':'application/json'},
              body:JSON.stringify(this.calculationInput)
            });
          } catch (error) { this.error = error.message; }
        },
        async saveCalculation() {
          try {
            const saved = await this.api('/calculations', {
              method:'POST', headers:{'Content-Type':'application/json'},
              body:JSON.stringify({
                name:this.calculationName,
                lead_id:this.calculationLeadId || null,
                parameters:this.calculationInput
              })
            });
            this.calculations.unshift(saved);
            this.calculationName = '';
          } catch (error) { this.error = error.message; }
        },
        loadCalculation(item) {
          this.calculationInput = JSON.parse(JSON.stringify(item.parameters));
          this.calculationResult = JSON.parse(JSON.stringify(item.result));
          this.calculationLeadId = item.lead_id || '';
          this.calculationName = `${item.name} — копия`;
        },
        money(value) {
          return new Intl.NumberFormat('ru-RU', {style:'currency',currency:'RUB',maximumFractionDigits:0}).format(value);
        },
        resultMetrics() {
          const r = this.calculationResult;
          if (!r) return [];
          return [
            ['Кабинеты', `${r.cabinet_columns} × ${r.cabinet_rows} = ${r.cabinet_count}`],
            ['Разрешение', `${r.resolution_width} × ${r.resolution_height}`],
            ['Пиковая мощность', `${r.peak_power_kw} кВт`],
            ['Цена продажи', this.money(r.suggested_sales_price)]
          ];
        }
      }
    }
  </script>
</body>
</html>
